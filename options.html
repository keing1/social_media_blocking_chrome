<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Social Media Filter Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    h2 {
      font-size: 18px;
      margin-top: 30px;
      margin-bottom: 15px;
      color: #1da1f2;
    }
    .option-group {
      background: #f7f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .checkbox-item {
      margin: 10px 0;
      display: flex;
      align-items: center;
    }
    .checkbox-item input[type="checkbox"] {
      margin-right: 10px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .checkbox-item label {
      cursor: pointer;
      user-select: none;
    }
    .number-item {
      margin: 10px 0;
    }
    .number-item input[type="number"] {
      width: 60px;
      margin: 0 6px;
    }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-top: 15px;
      display: none;
    }
    .status.show {
      display: block;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    button {
      background: #1da1f2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }
    button:hover {
      background: #1a91da;
    }
  </style>
</head>
<body>
  <h1>Social Media Content Filter</h1>

  <h2>X (Twitter) Settings</h2>
  <div class="option-group">
    <div class="checkbox-item">
      <input type="checkbox" id="hideForYouTab">
      <label for="hideForYouTab">Hide "For you" tab (show only "Following")</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="autoSwitchToFollowing">
      <label for="autoSwitchToFollowing">Auto-switch to "Following" tab on home page</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="hideHomeTabs">
      <label for="hideHomeTabs">Hide the "For you / Following" tab bar on home (use with auto-switch above)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="hideRightSidebar">
      <label for="hideRightSidebar">Hide right sidebar panes (Premium, trends, who to follow, ads, footer) — keeps the search bar</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="hideLeftSidebar">
      <label for="hideLeftSidebar">Hide left sidebar (navigation)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="hideMessagesDrawer">
      <label for="hideMessagesDrawer">Hide messages drawer (bottom right)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="hideGrokButton">
      <label for="hideGrokButton">Hide Grok button (bottom right)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="hideNonAuthorReplies">
      <label for="hideNonAuthorReplies">When viewing a post, hide replies not in threads with the post author</label>
    </div>
  </div>

  <h2>Facebook Settings</h2>
  <div class="option-group">
    <div class="checkbox-item">
      <input type="checkbox" id="fbHideFeed">
      <label for="fbHideFeed">Hide news feed (the wall, including stories) on the home page</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="fbHideLeftSidebar">
      <label for="fbHideLeftSidebar">Hide left sidebar (shortcuts: groups, marketplace, etc.)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="fbHideRightSidebar">
      <label for="fbHideRightSidebar">Hide right sidebar (contacts, sponsored, birthdays)</label>
    </div>
  </div>

  <h2>YouTube Settings</h2>
  <div class="option-group">
    <div class="checkbox-item">
      <input type="checkbox" id="ytHideShorts">
      <label for="ytHideShorts">Block Shorts everywhere (feeds, search, sidebar, channel tabs, menu; opening a Short plays it as a regular video)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="ytGate">
      <label for="ytGate">Ask why I'm here and wait 5 seconds before using YouTube</label>
    </div>
  </div>

  <h2>Reddit Settings</h2>
  <div class="option-group">
    <div class="checkbox-item">
      <input type="checkbox" id="rdHideFeeds">
      <label for="rdHideFeeds">Block the front page, r/popular, r/all, Explore and News feeds (subreddits and posts still work)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="rdHideRecommendations">
      <label for="rdHideRecommendations">Hide recommendations (suggested posts, recently viewed, trending searches, games)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="rdGate">
      <label for="rdGate">Ask why I'm here and wait 5 seconds before using Reddit</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="rdHideTopBar">
      <label for="rdHideTopBar">Hide top bar (logo, search, sign-in / profile buttons)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="rdHideLeftSidebar">
      <label for="rdHideLeftSidebar">Hide left sidebar (navigation, or the sign-up panel when logged out)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="rdHideRightSidebar">
      <label for="rdHideRightSidebar">Hide right sidebar (community info, rules, ads)</label>
    </div>

    <div class="checkbox-item">
      <input type="checkbox" id="rdLimitFeed">
      <label for="rdLimitFeed">Stop infinite scroll: show a limited number of posts, then a "Show more" button</label>
    </div>

    <div class="number-item">
      <label for="rdFeedLimit">Posts per batch</label>
      <input type="number" id="rdFeedLimit" min="5" max="500">
    </div>
  </div>

  <h2>"Why are you here?" Check</h2>
  <div class="option-group">
    <div class="number-item">
      <label for="gateMinutes">After passing the check, ask again after</label>
      <input type="number" id="gateMinutes" min="1" max="1440">
      <label for="gateMinutes">minutes</label>
    </div>
  </div>

  <button id="save">Save Settings</button>

  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
